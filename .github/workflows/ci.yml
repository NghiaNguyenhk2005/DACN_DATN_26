name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra spec OpenAPI
        run: pnpm lint:spec
      - name: Sinh kiểu từ openapi.yaml
        run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Chưa chặn gộp: job đỏ vẫn để PR gộp được; xem báo cáo Playwright ở artifact.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Build các package dùng chung
        run: pnpm turbo run build --filter="./packages/*"
      - name: Cài Chromium cho Playwright
        run: pnpm --filter @farmery/e2e exec playwright install --with-deps chromium
      - name: Chạy e2e (Playwright tự bật api, shop, admin)
        run: pnpm --filter @farmery/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
