name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểm tra spec OpenAPI
        run: pnpm lint:spec
      - name: Sinh kiểu từ openapi.yaml
        run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Kho PostgreSQL thật: migrate, seed hai lần (kiểm idempotent), rồi chạy test STORAGE=prisma.
  ci-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: farmery
          POSTGRES_PASSWORD: farmery
          POSTGRES_DB: farmery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmery -d farmery"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      STORAGE: prisma
      DATABASE_URL: postgresql://farmery:farmery@localhost:5432/farmery
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Build các package dùng chung
        run: pnpm turbo run build --filter="./packages/*"
      - name: Kiểm schema Prisma
        run: pnpm --filter @farmery/api exec prisma validate
      - name: Áp migration
        run: pnpm db:migrate
      - name: Seed lần 1
        run: pnpm db:seed
      - name: Seed lần 2 (phải chạy lại được)
        run: pnpm db:seed
      - name: Test trên PostgreSQL
        run: pnpm --filter @farmery/api exec jest test/storage.e2e-spec.ts --coverage=false

  # Chưa chặn gộp: job đỏ vẫn để PR gộp được; xem báo cáo Playwright ở artifact.
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - name: Build các package dùng chung
        run: pnpm turbo run build --filter="./packages/*"
      - name: Cài Chromium cho Playwright
        run: pnpm --filter @farmery/e2e exec playwright install --with-deps chromium
      - name: Chạy e2e (Playwright tự bật api, shop, admin)
        run: pnpm --filter @farmery/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # Dịch vụ AI (Python): lint và test bằng bộ nhúng giả, không tải mô hình BGE-M3 (2 GB) trên CI.
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Cài thư viện nhẹ (không có sentence-transformers và torch)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q fastapi uvicorn numpy pytest httpx ruff
      - run: .venv/bin/ruff check .
      - run: .venv/bin/python -m pytest -q
